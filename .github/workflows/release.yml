name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check manifest version matches tag
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/remindo/manifest.json'))['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "manifest $v != tag ${GITHUB_REF_NAME}"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
