add:
  fields:
    summary:
      required: true
      example: "Zamknij bramę garażową"
      selector:
        text:
    description:
      selector:
        text:
          multiline: true
    start:
      example: "now"
      default: "now"
      selector:
        text:
    interval:
      example: 30
      selector:
        number:
          min: 0
          max: 10080
          unit_of_measurement: min
          mode: box
    key:
      example: brama
      selector:
        text:
    repeat:
      default: none
      selector:
        select:
          options: [none, hourly, daily, weekly, monthly, yearly]
          translation_key: repeat
    repeat_every:
      default: 1
      selector:
        number:
          min: 1
          max: 365
          mode: box
    tts:
      selector:
        boolean:
    tts_message:
      selector:
        text:
    push:
      default: true
      selector:
        boolean:
    phones:
      example: "notify.mobile_app_mi_14t_pro"
      selector:
        text:
          multiple: true
    speakers:
      selector:
        entity:
          domain: media_player
          multiple: true
done:
  fields: &target
    uid:
      selector:
        text:
    key:
      selector:
        text:
dismiss:
  fields: *target
snooze:
  fields:
    uid:
      selector:
        text:
    key:
      selector:
        text:
    minutes:
      example: 10
      selector:
        number:
          min: 1
          max: 100000
          unit_of_measurement: min
          mode: box
    until:
      selector:
        text:
rule_save:
  fields:
    id:
      selector:
        text:
    summary:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
    mode:
      default: state
      selector:
        select:
          options: [state, above, below]
    value:
      required: true
      selector:
        text:
    for_minutes:
      default: 0
      selector:
        number:
          min: 0
          max: 10080
          unit_of_measurement: min
          mode: box
    auto_close:
      default: true
      selector:
        boolean:
    enabled:
      default: true
      selector:
        boolean:
    interval:
      selector:
        number:
          min: 0
          max: 10080
          unit_of_measurement: min
          mode: box
rule_delete:
  fields:
    id:
      required: true
      selector:
        text:
close_by_key:
  fields:
    key:
      required: true
      example: brama
      selector:
        text:
