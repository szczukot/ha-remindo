add:
  fields:
    summary:
      required: true
      example: "Close the garage door"
      selector:
        text:
    description:
      selector:
        text:
          multiline: true
    start:
      example: "now"
      default: "now"
      selector:
        text:
    interval:
      example: 30
      selector:
        number:
          min: 0
          max: 10080
          unit_of_measurement: min
          mode: box
    key:
      example: garage
      selector:
        text:
    repeat:
      default: none
      selector:
        select:
          options: [none, hourly, daily, weekly, monthly, yearly]
          translation_key: repeat
    repeat_every:
      default: 1
      selector:
        number:
          min: 1
          max: 365
          mode: box
    tts:
      selector:
        boolean:
    tts_message:
      selector:
        text:
    push:
      default: true
      selector:
        boolean:
    phones:
      example: "notify.mobile_app_phone"
      selector:
        text:
          multiple: true
    speakers:
      selector:
        entity:
          domain: media_player
          multiple: true
    max_reminders:
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    remind_until:
      example: "2026-11-10T22:00:00"
      selector:
        text:
    keep_done:
      selector:
        boolean:
    done_message:
      example: "Garage door closed ✅"
      selector:
        text:
    notify_data:
      example: '{"car_ui": true, "priority": "high", "ttl": 0}'
      selector:
        object:
done:
  fields: &target
    uid:
      selector:
        text:
    key:
      selector:
        text:
dismiss:
  fields: *target
reopen:
  fields: *target
delete:
  fields: *target
